# Local development stack.
#
#   docker compose up -d oracle     # database only (what Phase 0 needs)
#   docker compose logs -f oracle   # first start takes 1-3 minutes to init
#
# gvenzl/oracle-free is used rather than the official Oracle image: it is a
# fraction of the size, needs no container-registry login, and supports the
# init-scripts mount below, which is how the schema gets created on first run.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: smartinbox-oracle
    ports:
      - "1521:1521"
    environment:
      # Password for SYS / SYSTEM inside the container.
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-change_me_locally}
      # gvenzl images create this application user in FREEPDB1 on first boot,
      # so the app never connects as SYS.
      APP_USER: ${ORACLE_USER:-smartinbox}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-change_me_locally}
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Everything here runs once, in filename order, on first initialisation.
      - ./db/ddl:/container-entrypoint-initdb.d/ddl:ro
      - ./db/plsql:/container-entrypoint-initdb.d/plsql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  oracle-data:
